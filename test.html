<!-- _layouts/default.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FAIR DAO|FAIR|FAIR tokens are launched fairly on the SunPump platform, with no presale, no additional issuance, and no allocation plans"
    />
    <title>FAIR DAO</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="res/fair-512.png" />
    <link href="res/manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="res/fair-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="res/fair-192.png" />
    <link rel="stylesheet" href="res/bulma.min.css" />
    <link href="res/timeline.css" rel="stylesheet" />
    <link href="res/fair.css" rel="stylesheet" />
    <link rel="stylesheet" href="res/css/fontawesome.min.css" />
    <link rel="stylesheet" href="res/css/solid.min.css" />
    <link rel="stylesheet" href="res/css/brands.min.css" />
  </head>

  <body>
    <div>
      <header
        class="header"
        bind-html="/pages/header.html"
        bind-html-loaded="headerLoaded(e)"
      ></header>
      <div class="body">
        <main class="main-content">
 <div class="section" bind-json="legal"  id="service">
            <div class="container">
                <div class="has-text-centered">
              <div class="title is-2 mt-6" data-bind="json.service.title"></div>
              </div>
              <div class="subtitle is-4 mt-5" data-bind="json.service.description"></div>
              <div data-bind-for="json.service.subitems">
                <div class="title is-4 mt-3">{-item.index+1-}. {-item.title-}</div>
                <div class="subtitle is-5 mt-2">{-item.description-}</div>
              </div>
                 <div class="subtitle mt-5 mr-4 has-text-right" data-bind="json.service.update"></div>     
            </div>
          
</div>
        </main>
      </div>
      <footer class="footer" bind-html="/pages/footer.html"></footer>
    </div>
    <script src="/res/fair.js"></script>
  </body>
</html>
