
  <div class="container" bind-json="mission">
    <div class="columns is-vcentered">
      <!-- Left Image -->
      <div class="column is-5">
        <div class="card">
          <div class="card-image">
            <figure class="image">
              <img
                src="/res/img/net.png"
                alt="" data-bind="json.image_alt"
                class="has-shadow"
              />
            </figure>
          </div>
        </div>
      </div>

      <!-- Right Mission Description -->
      <div class="column is-7">
        <h2 class="title is-3 mb-4 has-text-primary" data-bind="json.title"></h2>
              <p class="mt-4 is-4" data-bind="json.description"></p>

        <div class="mt-6">
          <div class="field has-addons mb-3">
            <div class="control">
              <span class="tag is-success">
                <i class="fas fa-check"></i>
              </span>
            </div>
            <div class="control">
              <p data-bind="json.goals[0]"></p>
            </div>
          </div>

          <div class="field has-addons mb-3">
            <div class="control">
              <span class="tag is-success">
                <i class="fas fa-check"></i>
              </span>
            </div>
            <div class="control">
              <p data-bind="json.goals[1]"></p>
            </div>
          </div>

          <div class="field has-addons">
            <div class="control">
              <span class="tag is-success">
                <i class="fas fa-check"></i>
              </span>
            </div>
            <div class="control">
              <p data-bind="json.goals[2]"></p>
            </div>
          </div>

          <div class="field has-addons mt-3">
            <div class="control">
              <span class="tag is-success">
                <i class="fas fa-check"></i>
              </span>
            </div>
            <div class="control">
              <p data-bind="json.goals[3]"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
