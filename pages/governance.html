<!-- Governance Process Section -->
<div class="container" bind-json="governance">
    <div class="columns is-centered">
        <div class="column is-10">
            <div class="content has-text-centered mb-6">
                <h1 class="title is-3 mb-4 has-text-primary" data-bind="json.title"></h1>
            </div>
            <div class="timeline" data-bind-for="json.steps">
                <div class="timeline-item">
                    <div class="timeline-icon">
                        <i class="fa">{-item.index+1-}</i>
                    </div>
                    <div class="columns">
                        <div class="column is-6" data-bind-if="{-item.index-} % 2==0">
                            <!-- Left content empty for alternating layout -->
                        </div>
                        <div class="column is-6">
                            <div class="timeline-content">
                                <h3 class="timeline-title">{-item.title-}</h3>
                                <p class="timeline-description">{-item.description-}</p>
                            </div>
                        </div>
                        <div class="column is-6" data-bind-if="{-item.index-} % 2==1">
                            <!-- Right content empty for alternating layout -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
